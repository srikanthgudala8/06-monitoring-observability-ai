route:
  receiver: default
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    # Replace with a real receiver. Example Slack config (keep the URL secret,
    # e.g. use api_url_file instead of committing it):
    #
    # slack_configs:
    #   - api_url_file: /etc/alertmanager/slack_url
    #     channel: "#alerts"
    #     send_resolved: true

inhibit_rules:
  # If a target is down, suppress its warning-level alerts.
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [job]
