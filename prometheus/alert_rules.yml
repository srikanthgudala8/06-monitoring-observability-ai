groups:
  - name: availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.instance }} is down"
          description: "Prometheus has failed to scrape this target for more than 1 minute."

  - name: app-slo
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="app",status=~"5.."}[5m]))
            /
          sum(rate(http_requests_total{job="app"}[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests are failing"
          description: "Error ratio over the last 5 minutes is {{ $value | humanizePercentage }}."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="app"}[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 1s"
          description: "p95 latency is {{ $value | humanizeDuration }}."

  - name: host
    rules:
      - alert: HighCpuUsage
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU above 85% for 10 minutes"

      - alert: LowDiskSpace
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Less than 10% disk space left on {{ $labels.mountpoint }}"
