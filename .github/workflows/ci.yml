name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: flake8 .
      - run: pytest -q

      - name: Validate Prometheus alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/prometheus:/p:ro" \
            prom/prometheus:v2.54.1 check rules /p/alert_rules.yml

      - name: Validate Alertmanager config
        run: |
          docker run --rm --entrypoint amtool -v "$PWD/alertmanager:/a:ro" \
            prom/alertmanager:v0.27.0 check-config /a/alertmanager.yml

      - name: Validate compose file
        run: docker compose config -q
